async function api(p,m='GET',b){let r;try{r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined})}catch(e){throw new Error('Tidak bisa konek ke panel (tunnel putus / server mati)')}
const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}
if(r.status===401&&p!=='/login'&&p!=='/me'){me=null;route();return new Promise(()=>{})}
if(!r.ok)throw new Error(j.error||('HTTP '+r.status+' '+t.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,150)));return j}
const tr=async f=>{try{return await f()}catch(e){toast(e.message,'err')}};

function toast(msg,type='info'){const t=document.createElement('div');t.className='toast '+type;t.innerHTML=ic(type=='err'?'x':type=='ok'?'check':'server',17)+'<span>'+E(msg)+'</span>';$('#toasts').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),260)},type=='err'?5500:2800)}
function openModal(html,big=false){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md${big?' big':''}">${html}</div>`;document.body.appendChild(o);let res;const p=new Promise(r=>res=r);
const close=v=>{if(o._d)return;o._d=1;o.classList.add('out');setTimeout(()=>o.remove(),180);res(v)};o._c=close;
o.addEventListener('mousedown',e=>{if(e.target===o&&!big)close(null)});$$('[data-x]',o).forEach(b=>b.addEventListener('click',()=>close(b.dataset.x)));return{el:o,close,p}}
const ask=(title,val='',ph='')=>{const m=openModal(`<h3>${E(title)}</h3><input class=in id=mi value="${E(val)}" placeholder="${E(ph)}" autocomplete=off><div class=macts><button class="btn ghost" data-x="">Batal</button><button class="btn pri" id=mok>OK</button></div>`);const i=$('#mi',m.el);setTimeout(()=>{i.focus();i.select()},60);const go_=()=>m.close(i.value.trim());$('#mok',m.el).onclick=go_;i.onkeydown=e=>{if(e.key==='Enter')go_()};return m.p.then(v=>v||null)};
const sure=(msg,danger=true,okTxt='Ya, lanjut')=>openModal(`<h3>Konfirmasi</h3><p class=m>${msg}</p><div class=macts><button class="btn ghost" data-x="">Batal</button><button class="btn ${danger?'dng':'pri'}" data-x=1>${okTxt}</button></div>`).p.then(v=>v==='1');

if(!me)return loginView();

return `<div class=back><a href="#/">← Semua server</a></div>

/* ---------- upload queue ---------- */
const uq=[];let uid=0,uBusy=false,uqRaf=0;
function uploadFiles(fl){for(const f of fl)uq.push({f,id:++uid,name:f.name,size:f.size,loaded:0,st:'wait',dir:path,srv:cur});renderUQ();pump()}
async function pump(){if(uBusy)return;uBusy=true;
for(const it of uq){if(it.st!=='wait')continue;it.st='run';renderUQ();try{await sendFile(it);it.st='done'}catch(e){it.st=it.cancel?'cancel':'err';if(!it.cancel)toast(it.name+': '+e.message,'err')}renderUQ()}
uBusy=false;if(tab==='files'&&srvId===cur&&$('#fl'))loadFiles();
setTimeout(()=>{if(!uq.some(i=>i.st==='run'||i.st==='wait')){uq.length=0;renderUQ()}},4500)}
async function sendFile(it){const CH=4*1048576,f=it.f,full=(it.dir?it.dir+'/':'')+it.name;
if(f.size===0)return xhrChunk(it,full,0,f.slice(0,0));
for(let off=0;off<f.size;off+=CH){if(it.cancel)throw new Error('dibatalkan');await xhrChunk(it,full,off,f.slice(off,off+CH))}}
const xhrChunk=(it,full,off,blob)=>new Promise((res,rej)=>{let tries=0;const send=()=>{const x=new XMLHttpRequest();it.x=x;x.open('POST','/api/servers/'+it.srv+'/upload?path='+enc(full)+'&offset='+off);x.setRequestHeader('Content-Type','application/octet-stream');
x.upload.onprogress=e=>{it.loaded=off+e.loaded;renderUQ()};
x.onload=()=>{if(x.status<300){it.loaded=off+blob.size;renderUQ();return res()}let m;try{m=JSON.parse(x.responseText).error}catch{}if(x.status<500||++tries>=3)return rej(new Error(m||('HTTP '+x.status)));setTimeout(send,1000)};
x.onerror=()=>{if(++tries>=3)return rej(new Error('koneksi putus'));setTimeout(send,1000)};x.onabort=()=>rej(new Error('dibatalkan'));x.send(blob)};send()});
function renderUQ(){if(uqRaf)return;uqRaf=requestAnimationFrame(()=>{uqRaf=0;const el=$('#uq');if(!uq.length){el.classList.remove('show');return}
const act=uq.filter(i=>i.st==='run'||i.st==='wait').length;el.classList.add('show');
el.innerHTML=`<div class=uh><b>${ic('upload',15)} ${act?'Mengunggah ('+act+')':'Upload selesai'}</b><button class=ib data-uc=all>${ic('x',14)}</button></div>`+uq.map(i=>{const p=i.st=='done'?100:i.size?Math.min(100,i.loaded/i.size*100):0;return `<div class=ur><div class=ut><span>${E(i.name)}</span><small>${i.st=='done'?ic('check',13):i.st=='err'?'gagal':i.st=='cancel'?'batal':i.st=='wait'?'antre':Math.floor(p)+'%'}</small></div><div class=pbar><i class="${i.st}" style="width:${p}%"></i></div>${i.st=='run'||i.st=='wait'?`<a data-uc="${i.id}">batalkan</a>`:''}</div>`}).join('')})}
